---
- name: Configure Jenkins Master
  hosts: master
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java 21 and dependencies
      apt:
        name:
          - fontconfig
          - openjdk-21-jre
          - curl
          - gnupg
        state: present

    - name: Add Jenkins GPG key
      shell: curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key | tee /etc/apt/keyrings/jenkins-keyring.asc > /dev/null
      args:
        creates: /etc/apt/keyrings/jenkins-keyring.asc

    - name: Add Jenkins repository
      shell: echo "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" | tee /etc/apt/sources.list.d/jenkins.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/jenkins.list

    - name: Install Jenkins
      apt:
        name: jenkins
        update_cache: yes
        state: present

    - name: Ensure Jenkins is started and enabled
      service:
        name: jenkins
        state: started
        enabled: yes

- name: Configure Jenkins Agent with Docker
  hosts: agent
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java 21 and Docker
      apt:
        name:
          - openjdk-21-jre
          - docker.io
        state: present

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Ensure Docker is started and enabled
      service:
        name: docker
        state: started
        enabled: yes
